<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/repartidor/manifest.webmanifest"><title>Repartidor</title></head><body>
<div id="login"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button id="ok">Entrar</button> <span id="err"></span></div>
<div id="app" hidden><button id="salir">Salir</button><div id="l"></div></div>
<script>
const $=i=>document.getElementById(i);let timer;
async function api(u,b){const r=await fetch(u,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(r.status===401&&u!=="/repartidor/entrar"){mostrar(false);throw 0}if(!r.ok)throw new Error(j.error||"Error");return j}
function mostrar(s){$("login").hidden=s;$("app").hidden=!s;clearInterval(timer);if(s){sondeo();timer=setInterval(sondeo,5000)}}
async function sondeo(){try{const e=await api("/repartidor/pedidos");const l=$("l");l.textContent="";for(const p of e.pedidos){const d=document.createElement("div");d.textContent="#"+p.id+" "+p.estado+" · "+p.nombre+" · "+p.telefono+" · "+(p.direccion||"")+" "+(p.zona||"")+" · "+p.total;
const m=document.createElement("a");m.href=p.mapa;m.target="_blank";m.rel="noopener";m.textContent=" Abrir en Google Maps";d.append(m);
for(const a of p.acciones){const b=document.createElement("button");b.textContent=a;b.onclick=async()=>{try{await api("/repartidor/marcar",{pedido_id:p.id,estado:a});sondeo()}catch(x){alert(x.message)}};d.append(b)}l.append(d)}}catch(x){}}
$("ok").onclick=async()=>{try{await api("/repartidor/entrar",{pin:$("pin").value});$("pin").value="";$("err").textContent="";mostrar(true)}catch(x){$("err").textContent=x.message}};
$("salir").onclick=async()=>{await api("/repartidor/salir",{}).catch(()=>{});mostrar(false)};
if("serviceWorker" in navigator)navigator.serviceWorker.register("/repartidor/sw.js",{scope:"/repartidor/"}).catch(()=>{});
api("/repartidor/pedidos").then(()=>mostrar(true)).catch(()=>{});
</script></body></html>

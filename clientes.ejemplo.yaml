# Copiar a clientes.yaml (no se sube al repo) y arrancar con: python -m motor alojar clientes.yaml 8080
# slug: minúsculas, números y guiones; es también el sufijo de sus variables del .env
#   (PANEL_PIN_DELIFOOD, REPARTIDORES_DELIFOOD, TURSO_DATABASE_URL_DELIFOOD...; guiones -> guion bajo).
# carpeta: relativa a este archivo; cada cliente la suya (su BD y sus archivos viven ahí).
# dominio: el que escribe el cliente final, sin https:// ni puerto. En local vale también <slug>.localhost.
# activo: false = pausado (responde 404, como un dominio desconocido).
# Opcionales, solo del operador (el dueño del restaurante no los ve ni los cambia); se aplican sin reiniciar:
#   modulos: [estadisticas]   manda sobre el `modulos` de su servicio.yaml; [] = ninguno; sin la línea = lo que diga su servicio.yaml
#   pagado_hasta: 2026-12-31  precio: 35 (US$/mes)  notas: "texto libre, máx. 500"
#   prueba_hasta: 2026-12-15  prueba gratis: funciona normal hasta ese día incluido; al día siguiente responde 404 como un pausado
#                             (para seguir: quitar la línea o cambiar la fecha). Sin la línea nunca se pausa por fecha (ni por pagado_hasta).
#   tope_ia_dia: 300          turnos de chat con IA al día (0 = sin tope, máx. 100000). Sin la línea: 300 si tiene prueba_hasta
#                             (o TOPE_IA_DIA del .env) y sin tope los demás. Al llegar, el chat pide llamar al restaurante; lo demás sigue.
#   archivado: 2026-12-20     lo pone la consola del operador al archivar (con activo: false): no se sirve y conserva sus datos;
#                             «restaurar» quita la línea. Solo un archivado se puede eliminar.
clientes:
  delifood: {carpeta: servicios/restaurante-pedidos, dominio: delifood.com, activo: true}

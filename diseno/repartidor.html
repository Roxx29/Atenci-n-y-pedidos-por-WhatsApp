<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A8321F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Repartos">
<link rel="manifest" href="/repartidor/manifest.webmanifest">
<link rel="icon" href="/repartidor/icono.svg" type="image/svg+xml">
<title>Repartos · Fonda El Chitreano</title>
<style>
/* Pensado para el sol: fondo blanco, tinta casi negra y botones enormes. Sin modo oscuro a propósito. */
:root{
  --fondo:#FFFFFF; --papel:#F6F0E4; --tinta:#1E120C; --tinta-2:#5A4537; --linea:#DCCDB6;
  --achiote:#A8321F; --achiote-osc:#8A2817; --achiote-suave:#FBE3DE;
  --hoja:#2F6B3A; --hoja-osc:#245530; --hoja-suave:#E3F0E2; --maiz:#E9B949; --maiz-suave:#FFF3D1;
  --r:14px; --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --texto:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:18px/1.4 var(--texto);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
::selection{background:var(--maiz);color:var(--tinta)}
:focus-visible{outline:4px solid var(--maiz);outline-offset:2px}
button,input,a{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h1,h2{margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;padding:0 18px;border-radius:var(--r);border:0;font-weight:800;font-size:1.25rem;text-decoration:none;background:var(--achiote);color:#fff;transition:transform .08s,background .12s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--achiote-osc)}
.btn.ok{background:var(--hoja)} .btn.ok:hover{background:var(--hoja-osc)}
.btn.sec{background:var(--fondo);color:var(--tinta);border:2px solid var(--tinta)}
.btn.sec:hover{background:var(--papel)}
.btn:disabled{opacity:.55;cursor:progress}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Entrada */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.caja{width:min(380px,100%);text-align:center}
.caja h1{font-family:var(--display);font-size:2rem}
.caja p{color:var(--tinta-2);margin:6px 0 18px}
#pin{width:100%;min-height:64px;text-align:center;font-size:2rem;letter-spacing:.4em;border:2px solid var(--linea);border-radius:var(--r);background:var(--fondo);caret-color:var(--achiote)}
#pin:focus{outline:none;border-color:var(--achiote)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.teclado button{min-height:68px;border-radius:var(--r);border:2px solid var(--linea);background:var(--fondo);font-size:1.625rem;font-weight:700}
.teclado button:active{background:var(--papel)}
.teclado .btn{border:0;font-size:1.25rem}
.error{color:var(--achiote);font-weight:700;min-height:1.4em;margin:0}

/* Barra */
.barra{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 10px 16px;background:var(--achiote);color:#fff}
.barra h1{flex:1;min-width:0;font-family:var(--display);font-size:1.375rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra button{display:inline-flex;align-items:center;gap:6px;min-height:52px;min-width:52px;padding:0 14px;border:2px solid rgba(255,255,255,.55);border-radius:12px;background:none;color:#fff;font-weight:700}
.barra button:active{background:rgba(255,255,255,.15)}

/* Lista */
main{padding:14px 12px max(24px,env(safe-area-inset-bottom))}
.lista{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.pedido{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;width:100%;padding:16px;border-radius:var(--r);border:2px solid var(--linea);background:var(--fondo);text-align:left;box-shadow:0 2px 8px rgba(30,18,12,.08)}
.pedido:active{background:var(--papel)}
.pedido.nuevo{border-color:var(--maiz);box-shadow:0 0 0 4px var(--maiz-suave)}
.pedido .n{grid-row:span 3;font-size:2.5rem;font-weight:900;line-height:1}
.pedido .nombre{font-size:1.375rem;font-weight:800;overflow-wrap:break-word}
.pedido .zona{color:var(--tinta-2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:1rem;font-weight:800;white-space:nowrap;background:var(--papel);color:var(--tinta)}
.chip.pagado{background:var(--hoja-suave);color:var(--hoja-osc)}
.chip.cobrar{background:var(--achiote);color:#fff}
.chip.camino{background:var(--maiz);color:var(--tinta)}
.vacio{text-align:center;color:var(--tinta-2);padding:48px 16px}
.vacio b{display:block;color:var(--tinta);font-size:1.375rem;margin-bottom:6px}

/* Detalle */
#detalle main{display:grid;gap:14px;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.cliente{margin:0;font-size:1.75rem;font-weight:900;overflow-wrap:break-word}
.cobro{padding:16px;border-radius:var(--r);font-weight:800;font-size:1.25rem}
.cobro.cobrar{background:var(--achiote-suave);color:var(--achiote-osc)}
.cobro.cobrar b{display:block;font-size:2.25rem;color:var(--tinta)}
.cobro.pagado{background:var(--hoja-suave);color:var(--hoja-osc);display:flex;gap:10px;align-items:center}
.bloque{padding:16px;border-radius:var(--r);background:var(--papel)}
.bloque h2{font-size:.875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-2);margin-bottom:6px}
.bloque p{margin:0}
.dir{font-size:1.25rem;font-weight:700}
.nota{margin-top:8px!important;font-weight:700;color:var(--achiote-osc)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items b{display:inline-block;min-width:2.2em}
.total{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:2px dashed var(--linea);font-weight:900;font-size:1.25rem}
.pie{position:fixed;left:0;right:0;bottom:0;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:var(--fondo);box-shadow:0 -6px 18px rgba(30,18,12,.12);display:grid;gap:10px}
.pie .btn{min-height:72px;font-size:1.375rem}
.pie p{margin:0;text-align:center;font-weight:700}
.espera{color:var(--tinta-2);font-weight:700;text-align:center;min-height:56px;display:grid;place-items:center}

.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);z-index:5;padding:16px;border-radius:var(--r);background:var(--tinta);color:#fff;font-weight:700;text-align:center;transform:translateY(-150%);visibility:hidden;transition:transform .3s cubic-bezier(.16,1,.3,1)}
.toast.ver{transform:none;visibility:visible}
.toast.mal{background:var(--achiote)}
@media (min-width:640px){main,.pie{max-width:560px;margin-inline:auto}.pie{left:50%;right:auto;width:560px;transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mapa" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-tel" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 20l1.5-4A8 8 0 1 1 9 19.5z"/></symbol>
  <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-moto" viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-3-7H8M15 7h3l2 5"/></symbol>
</svg>

<!-- ============ Entrada ============ -->
<main id="login">
  <form class="caja" id="form-pin" novalidate>
    <h1>Repartos</h1>
    <p>Fonda El Chitreano. Escribe tu PIN de 6 números.</p>
    <label class="sr" for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" aria-describedby="e-pin" required>
    <div class="teclado" aria-label="Teclado numérico">
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      <button type="button">7</button><button type="button">8</button><button type="button">9</button>
      <button type="button" data-borrar aria-label="Borrar">⌫</button><button type="button">0</button>
      <button type="submit" class="btn">Entrar</button>
    </div>
    <p class="error" id="e-pin" role="alert"></p>
  </form>
</main>

<!-- ============ Mis pedidos ============ -->
<div id="vista-lista" hidden>
  <header class="barra"><h1 id="hola">Mis pedidos</h1><button id="btn-salir">Salir</button></header>
  <main>
    <ul class="lista" id="lista" aria-live="polite"></ul>
    <div class="vacio" id="vacio" hidden><b>Sin pedidos por ahora</b>Cuando te asignen uno aparece aquí y el teléfono vibra.</div>
  </main>
</div>

<!-- ============ Un pedido ============ -->
<div id="detalle" hidden>
  <header class="barra"><button id="btn-atras" aria-label="Volver a mis pedidos"><svg class="i" aria-hidden="true"><use href="#i-atras"/></svg>Pedidos</button><h1 id="d-num"></h1></header>
  <main>
    <p class="cliente" id="d-nombre"></p>
    <div class="cobro" id="d-cobro"></div>
    <a class="btn" id="d-mapa" target="_blank" rel="noopener"><svg class="i" aria-hidden="true"><use href="#i-mapa"/></svg>Abrir ruta en Google Maps</a>
    <div class="fila">
      <a class="btn sec" id="d-llamar"><svg class="i" aria-hidden="true"><use href="#i-tel"/></svg>Llamar</a>
      <a class="btn sec" id="d-wa"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>WhatsApp</a>
    </div>
    <section class="bloque"><h2>Dirección</h2><p class="dir" id="d-dir"></p><p id="d-zona"></p><p class="nota" id="d-notas"></p></section>
    <section class="bloque"><h2>Lleva</h2><ul class="items" id="d-items"></ul><div class="total"><span>Total</span><span class="num" id="d-total"></span></div></section>
  </main>
  <div class="pie" id="d-pie"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
function h(tag, attrs, ...hijos) { // el texto del servidor siempre entra como texto
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === "class") e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of hijos.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
function icono(n) { const ns = document.querySelector("svg").namespaceURI, s = document.createElementNS(ns, "svg"); s.setAttribute("class", "i"); s.setAttribute("aria-hidden", "true"); const u = document.createElementNS(ns, "use"); u.setAttribute("href", "#i-" + n); s.append(u); return s; }
const num = x => typeof x === "string" ? parseFloat(((x.match(/-?\d+(?:[.,]\d+)?/) || ["0"])[0]).replace(",", ".")) : Number(x);
const dinero = n => { const v = num(n); return "B/. " + (isFinite(v) ? v : 0).toFixed(2); };
const pagado = p => p.pagado != null ? !!p.pagado : !(num(p.cobrar) > 0); // acepta pagado:bool o cobrar:"B/. 0.00"
const aCobrar = p => num(p.cobrar) > 0 ? p.cobrar : p.total;
const ESTADO = {en_preparacion:"En cocina", listo:"Listo para recoger", en_camino:"En camino"};
const ORDEN = {en_camino:0, listo:1, en_preparacion:2};

const st = {demo:location.protocol === "file:", pedidos:[], conocidos:null, nuevos:new Set(), abierto:null, sondeo:0};

/* ---------- PWA ---------- */
if ("serviceWorker" in navigator && !st.demo) navigator.serviceWorker.register("/repartidor/sw.js", {scope:"/repartidor/"}).catch(() => {});

/* ---------- Entrada ---------- */
const pin = $("#pin");
$(".teclado").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.type === "submit") return;
  if (b.hasAttribute("data-borrar")) pin.value = pin.value.slice(0, -1); else if (pin.value.length < 6) pin.value += b.textContent;
  pin.focus();
});
$("#form-pin").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!/^\d{6}$/.test(pin.value)) { $("#e-pin").textContent = "El PIN tiene 6 números."; return pin.focus(); }
  $("#e-pin").textContent = ""; let nombre = "Juan";
  if (!st.demo) {
    try {
      const r = await fetch("/repartidor/entrar", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pin:pin.value})});
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { $("#e-pin").textContent = j.error || "PIN incorrecto."; pin.value = ""; return pin.focus(); }
      nombre = j.nombre || "";
    } catch (e) { $("#e-pin").textContent = "Sin conexión. Revisa tu internet e inténtalo otra vez."; return; }
  }
  pin.value = ""; $("#login").hidden = true;
  $("#hola").textContent = nombre ? "Hola, " + nombre : "Mis pedidos";
  ver("lista"); cargar(); clearInterval(st.sondeo); st.sondeo = setInterval(cargar, 6000);
});
$("#btn-salir").onclick = async () => { clearInterval(st.sondeo); if (!st.demo) await fetch("/repartidor/salir", {method:"POST"}).catch(() => {}); location.reload(); };

/* ---------- Datos ---------- */
async function cargar() {
  try {
    let lista;
    if (st.demo) lista = demoPedidos();
    else {
      const r = await fetch("/repartidor/pedidos");
      if (r.status === 401) return location.reload();
      if (!r.ok) throw new Error();
      lista = (await r.json()).pedidos || [];
    }
    // Solo activos: lo entregado desaparece (legal).
    st.pedidos = lista.filter(p => p.estado in ORDEN).sort((a, b) => ORDEN[a.estado] - ORDEN[b.estado] || a.id - b.id);
    const ids = new Set(st.pedidos.map(p => p.id));
    if (st.conocidos) {
      const llegan = [...ids].filter(id => !st.conocidos.has(id));
      if (llegan.length) { llegan.forEach(id => st.nuevos.add(id)); avisar(llegan.length === 1 ? `Nuevo pedido #${llegan[0]}` : `${llegan.length} pedidos nuevos`); }
    }
    st.conocidos = ids;
    pintarLista();
    if (st.abierto) { const p = st.pedidos.find(x => x.id === st.abierto); if (p) pintarDetalle(p); else ver("lista"); }
  } catch (e) { /* sin señal: reintenta solo */ }
}

/* ---------- Vistas ---------- */
function ver(cual) {
  $("#vista-lista").hidden = cual !== "lista"; $("#detalle").hidden = cual !== "detalle";
  if (cual === "lista") st.abierto = null;
  window.scrollTo(0, 0);
}
$("#btn-atras").onclick = () => { ver("lista"); pintarLista(); };
window.addEventListener("popstate", () => { if (!$("#detalle").hidden) { ver("lista"); pintarLista(); } });

function pintarLista() {
  $("#vacio").hidden = st.pedidos.length > 0;
  $("#lista").replaceChildren(...st.pedidos.map(p => h("li", {},
    h("button", {class:"pedido" + (st.nuevos.has(p.id) ? " nuevo" : ""), on:{click:() => abrir(p.id)}, "aria-label":`Pedido ${p.id}, ${p.nombre}, ${p.zona || ""}, ${pagado(p) ? "pagado" : "cobrar " + dinero(aCobrar(p))}, ${ESTADO[p.estado]}`},
      h("span", {class:"n num"}, "#" + p.id),
      h("span", {class:"nombre"}, p.nombre),
      h("span", {class:"zona"}, [p.zona, p.hora_deseada].filter(Boolean).join(" · ") || "Entrega"),
      h("span", {class:"chips"},
        pagado(p) ? h("span", {class:"chip pagado"}, icono("check"), "Pagado") : h("span", {class:"chip cobrar num"}, "Cobrar " + dinero(aCobrar(p))),
        h("span", {class:"chip" + (p.estado === "en_camino" ? " camino" : "")}, ESTADO[p.estado]))))));
}

function abrir(id) {
  const p = st.pedidos.find(x => x.id === id); if (!p) return;
  st.nuevos.delete(id); st.abierto = id;
  history.pushState({pedido:id}, "");
  pintarDetalle(p); ver("detalle"); st.abierto = id; $("#d-mapa").focus();
}
function pintarDetalle(p) {
  $("#d-num").textContent = "Pedido #" + p.id;
  $("#d-nombre").textContent = p.nombre;
  const c = $("#d-cobro");
  if (pagado(p)) { c.className = "cobro pagado"; c.replaceChildren(icono("check"), "Ya pagado. No cobres nada."); }
  else { c.className = "cobro cobrar"; c.replaceChildren("Cobrar en efectivo", h("b", {class:"num"}, dinero(aCobrar(p)))); }
  const mapa = p.mapa || p.mapa_url;
  $("#d-mapa").hidden = !mapa; if (mapa) $("#d-mapa").href = mapa;
  const tel = String(p.telefono || "").replace(/\D/g, "");
  $("#d-llamar").href = "tel:+" + tel; $("#d-wa").href = "whatsapp://send?phone=" + tel;
  $("#d-llamar").parentElement.hidden = !tel;
  $("#d-dir").textContent = p.direccion || "Sin dirección escrita: usa el mapa o llama al cliente.";
  $("#d-zona").textContent = [p.zona, p.hora_deseada && "Hora: " + p.hora_deseada].filter(Boolean).join(" · ");
  $("#d-notas").textContent = p.notas ? "Nota: " + p.notas : ""; $("#d-notas").hidden = !p.notas;
  $("#d-items").replaceChildren(...(p.items || []).map(i => h("li", {}, h("b", {class:"num"}, i.cantidad + "×"), " " + i.nombre)));
  $("#d-total").textContent = dinero(p.total);
  pintarPie(p);
}
const puede = (p, e) => p.acciones ? p.acciones.includes(e) : (e === "en_camino" ? p.estado === "listo" : p.estado === "en_camino");
function pintarPie(p, confirmar) {
  const pie = $("#d-pie");
  if (confirmar) return pie.replaceChildren(
    h("p", {}, "¿Ya cobraste " + dinero(aCobrar(p)) + " en efectivo?"),
    h("div", {class:"fila"}, h("button", {class:"btn ok", on:{click:() => marcar(p, "entregado")}}, "Sí, entregado"), h("button", {class:"btn sec", on:{click:() => pintarPie(p)}}, "Volver")));
  if (puede(p, "en_camino")) return pie.replaceChildren(h("button", {class:"btn", on:{click:() => marcar(p, "en_camino")}}, icono("moto"), "Recogí el pedido · En camino"));
  if (puede(p, "entregado")) return pie.replaceChildren(h("button", {class:"btn ok", on:{click:() => pagado(p) ? marcar(p, "entregado") : pintarPie(p, true)}}, icono("check"), "Entregado"));
  pie.replaceChildren(h("p", {class:"espera"}, p.estado === "en_preparacion" ? "Aún en cocina. Te avisamos cuando esté listo." : "Esperando al restaurante."));
}
async function marcar(p, estado) {
  const botones = $("#d-pie").querySelectorAll("button"); botones.forEach(b => b.disabled = true);
  try {
    if (st.demo) { p.estado = estado; p.acciones = null; }
    else {
      const r = await fetch("/repartidor/marcar", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({pedido_id:p.id, estado})});
      if (r.status === 401) return location.reload();
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || "No se pudo guardar. Inténtalo otra vez.");
      Object.assign(p, j.pedido || {estado});
    }
    if (estado === "entregado") { avisar(`#${p.id} entregado. ¡Gracias!`); history.back(); ver("lista"); await cargar(); }
    else { avisar(`#${p.id}: en camino`); pintarDetalle(p); }
  } catch (e) { avisar(e.message, true); botones.forEach(b => b.disabled = false); }
}

/* ---------- Avisos ---------- */
let tToast, audio;
function avisar(t, mal) {
  const e = $("#toast"); e.textContent = t; e.classList.toggle("mal", !!mal); e.classList.add("ver");
  clearTimeout(tToast); tToast = setTimeout(() => e.classList.remove("ver"), mal ? 6000 : 3500);
  if (!mal && /^Nuevo|nuevos/.test(t)) {
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (x) {}
    try { audio = audio || new AudioContext(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .25; o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + .25); } catch (x) {}
  }
}

/* ---------- Demostración (sin servidor) ---------- */
// ponytail: datos de ejemplo para el prototipo; con servidor salen de /repartidor/pedidos.
let DEMO;
function demoPedidos() {

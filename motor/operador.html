<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Consola del operador</title>
<style>
:root{color-scheme:dark;--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e8eaf0;--mut:#8b93a5;--ac:#6ea8fe;--ok:#4cc38a;--warn:#f0b429;--bad:#ef6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:20px;margin:0}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px}
button{cursor:pointer;transition:transform .15s ease,opacity .15s ease}
button:active{transform:scale(.97)}
button:disabled{opacity:.5}
button.p{background:var(--ac);color:#0b1020;border-color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#login{max-width:320px;margin:20vh auto;display:grid;gap:10px}
#login input{width:100%}
.err{color:var(--bad);min-height:1.4em;margin:0}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.nom{font-weight:600;font-size:16px}
.dom{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:var(--ok)}.pill.off{color:var(--warn);border-color:var(--warn)}
.m{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.m b{display:block;font-size:17px}.m span{color:var(--mut);font-size:12px}
.mods{color:var(--mut);font-size:13px;margin-bottom:10px;overflow-wrap:anywhere}
.acc{display:flex;gap:8px;flex-wrap:wrap}
.warn{color:var(--warn)}
.pill.al_dia{color:var(--ok);border-color:var(--ok)}.pill.por_vencer{color:var(--warn);border-color:var(--warn)}.pill.vencido{color:var(--bad);border-color:var(--bad)}.pill.sin_pago{color:var(--mut)}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.f{display:grid;gap:4px;color:var(--mut);font-size:12px}
.f input,.f textarea,.f select{width:100%;resize:vertical}
.ed{display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:8px;align-items:end;margin-bottom:10px}
.ck{display:inline-flex;gap:6px;align-items:center;margin-left:10px}.ck input{min-height:0;width:18px;height:18px}
.hist{margin:6px 0 10px;padding-left:18px;color:var(--mut);font-size:13px}
summary{cursor:pointer;color:var(--mut);font-size:13px;margin-bottom:4px}
.pr{margin-top:10px;align-items:center}.ia{margin-top:10px;display:grid;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transform-origin:left;transition:transform .25s ease}.bar i.hi{background:var(--warn)}
@media (max-width:560px){.ed{grid-template-columns:1fr}}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(440px,92vw);max-height:92vh;overflow:auto;animation:in .2s ease both}
dialog h2{font-size:18px;margin:0 0 4px}
.ayuda{color:var(--mut);font-size:12px;margin:0}
.pin{font:600 22px ui-monospace,monospace;letter-spacing:.15em}
.f input[type=color]{width:64px;padding:2px}
.f [aria-invalid=true]{border-color:var(--bad)}
a{color:var(--ac);overflow-wrap:anywhere}
dialog::backdrop{background:#0009}
dialog form{display:grid;gap:8px}
.err:empty{min-height:0}
#msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
#msg.v{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<form id="login" hidden>
  <h1>Consola del operador</h1>
  <label for="clave">Clave</label>
  <input id="clave" type="password" autocomplete="current-password" required>
  <button class="p">Entrar</button>
  <p class="err" id="lerr" role="alert"></p>
</form>
<section id="app" hidden>
  <header><h1>Clientes</h1><button class="p" id="nuevo">Nuevo cliente</button><button id="salir">Salir</button></header>
  <div class="m res" id="resumen"></div>
  <div class="acc" style="margin-bottom:12px"><label class="f">Ver <select id="filtro"><option value="todos">Todos (vencidos primero)</option><option value="pend">Solo vencidos y por vencer</option><option value="pruebas">Solo pruebas (las que vencen primero)</option></select></label></div>
  <div class="grid" id="lista"></div>
</section>
</main>
<dialog id="dlg" aria-labelledby="dt">
  <form id="fnuevo" novalidate>
    <h2 id="dt">Nuevo restaurante</h2>
    <label class="f">Nombre del negocio<input id="nom" required maxlength="80" autocomplete="off" aria-describedby="e_nom"></label>
    <p class="err" id="e_nom"></p>
    <label class="f">Identificador (slug)<input id="slug" required maxlength="40" autocapitalize="none" autocomplete="off" aria-describedby="e_slug"></label>
    <p class="err" id="e_slug"></p>
    <label class="f">Dominio<input id="dom" required inputmode="url" autocapitalize="none" autocomplete="off" placeholder="pizza.tudominio.com" aria-describedby="a_dom e_dom"></label>
    <p class="ayuda" id="a_dom">Un subdominio tuyo como pizza.tudominio.com o el dominio propio del cliente.</p>
    <p class="err" id="e_dom"></p>
    <div class="f">PIN del dueño (6 dígitos)
      <div class="acc"><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Vacío = lo genera el servidor" aria-label="PIN del dueño" aria-describedby="e_pin" style="flex:1"><button type="button" id="gen">Generar</button></div></div>
    <p class="err" id="e_pin"></p>
    <div class="acc">
      <label class="f">Color de marca<input id="col" type="color" value="#d62828"></label>
      <label class="f">Prueba<select id="pru"><option value="0">Sin prueba</option><option value="7">7 días</option><option value="15" selected>15 días</option><option value="30">30 días</option></select></label>
    </div>
    <p class="err" id="nerr" role="alert"></p>
    <div class="acc"><button class="p" id="crea">Crear</button><button type="button" id="cancela">Cancelar</button></div>
  </form>
  <div id="ok" hidden>
    <h2 id="okt" tabindex="-1">Restaurante creado</h2>
    <p class="dom">Web: <a id="ok_web" target="_blank" rel="noopener"></a></p>
    <p class="dom">Panel: <a id="ok_panel" target="_blank" rel="noopener"></a></p>
    <p class="dom" id="ok_prueba"></p>
    <p>PIN del dueño: <b class="pin" id="ok_pin"></b></p>
    <p class="warn">Anótalo o cópialo ahora: no se vuelve a mostrar.</p>
    <div class="acc"><button class="p" id="copia">Copiar mensaje para el cliente</button><button id="otro">Crear otro</button><button id="cierra">Cerrar</button></div>
  </div>
</dialog>
<div id="msg" role="status"></div>
<script>
const $=id=>document.getElementById(id);
const B=n=>"B/. "+(n/100).toFixed(2);
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.round(n/1024)+" KB";
async function api(m,u,d){
  const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:d?JSON.stringify(d):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&u!=="/api/entrar"){mostrar(false)}
  if(!r.ok)throw new Error(j.error||"error");
  return j;
}
function aviso(t){const m=$("msg");m.textContent=t;m.classList.add("v");setTimeout(()=>m.classList.remove("v"),2500)}
function mostrar(ok){$("login").hidden=ok;$("app").hidden=!ok}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function medida(v,l){const d=el("div");d.append(el("b","",v),el("span","",l));return d}
const ORDEN={vencido:0,por_vencer:1,sin_pago:2,al_dia:3};
let datos=null,filtro="todos";
function campo(t,x){const l=el("label","f"),i=el(t==="textarea"?"textarea":"input");l.append(el("span","",x),i);return[l,i]}
function bloquePrueba(c){
  const d=el("div","acc pr"),en=c.prueba_dias!==null;
  const sel=el("select");[7,15,30].forEach(v=>{const o=el("option","",v+" días");o.value=v;if(v===15)o.selected=true;sel.append(o)});
  const call=(b,body,msg)=>accion(b,()=>api("POST","/api/clientes/"+c.slug+"/prueba",body),msg);
  if(en){
    d.append(el("span","pill "+(c.prueba_dias<0?"vencido":c.prueba_dias<=3?"por_vencer":"al_dia"),c.etiqueta_prueba),sel);
    const x=el("button","","Extender prueba");x.onclick=()=>call(x,{accion:"extender",dias:Number(sel.value)},j=>"Prueba hasta "+j.hasta);
    const m=el("select");[1,3,12].forEach(v=>{const o=el("option","",v+(v===1?" mes":" meses"));o.value=v;m.append(o)});
    const p=el("button","p","Pasar a pago");p.onclick=()=>call(p,{accion:"pagar",meses:Number(m.value)},j=>"Pagado hasta "+j.hasta);
    d.append(x,m,p);
  }else{
    const i=el("button","","Iniciar prueba");i.onclick=()=>call(i,{accion:"iniciar",dias:Number(sel.value)},j=>"Prueba hasta "+j.hasta);
    d.append(el("span","dom","Sin prueba"),sel,i);
  }
  return d;
}
function bloqueIA(c){
  const d=el("div","ia"),t=c.tope_ia,p=t>0?Math.min(c.uso_ia/t,1):0,alto=t>0&&c.uso_ia/t>=0.8;
  const txt=el("span",alto?"warn":"dom","IA hoy: "+c.uso_ia+" / "+(t>0?t:"sin tope")+" mensajes"+(alto?" · cerca del tope":""));
  const barra=el("div","bar"),fill=el("i",alto?"hi":"");fill.style.transform="scaleX("+p+")";barra.append(fill);
  const [l,i]=campo("input","Tope diario (0 = sin tope)");i.type="number";i.min=0;i.max=100000;i.step=1;i.inputMode="numeric";i.value=t;
  const g=el("button","","Guardar tope");
  g.onclick=()=>accion(g,()=>api("POST","/api/clientes/"+c.slug+"/config",{tope_ia_dia:Number(i.value)}),null);
  const f=el("div","acc");f.append(l,g);f.style.alignItems="end";
  d.append(txt,barra,f);return d;
}
function tarjeta(c,cat){
  const k=el("article","card"),t=el("div","top"),n=el("div");
  n.append(el("div","nom",c.slug),el("div","dom",c.dominio||"sin dominio"));
  const pills=el("div","acc");
  pills.append(el("span","pill "+c.estado_pago,c.etiqueta_pago),el("span","pill "+(c.activo?"on":"off"),c.activo?"Activo":"Pausado"));
  t.append(n,pills);
  const m=el("div","m");
  m.append(medida(c.hoy,"pedidos hoy"),medida(c.ultimo?c.ultimo.replace("T"," ").slice(0,16):"—","último pedido"),
    medida(B(c.ventas_mes),"ventas del mes"),medida(kb(c.bytes),"base de datos"),medida(c.avisos,"avisos pendientes"));
  const mo=el("div","mods");
  mo.append(el("span","","Módulos:"));
  const cks=cat.map(x=>{const l=el("label","ck"),i=el("input");i.type="checkbox";i.checked=c.modulos.includes(x);l.append(i,el("span","",x));mo.append(l);return[x,i]});
  if(c.error)mo.append(el("span","warn"," · error en "+c.error));
  const [lp,ip]=campo("input","Precio (US$/mes)");ip.type="number";ip.min=0;ip.step="0.01";ip.inputMode="decimal";ip.value=c.precio??"";
  const [ln,inn]=campo("textarea","Notas");inn.maxLength=500;inn.rows=2;inn.value=c.notas;
  const g=el("button","","Guardar");
  g.onclick=()=>accion(g,()=>api("POST","/api/clientes/"+c.slug+"/config",
    {modulos:cks.filter(([,i])=>i.checked).map(([x])=>x),precio:ip.value===""?undefined:Number(ip.value),notas:inn.value}),null);
  const ed=el("div","ed");ed.append(lp,ln,g);
  const sel=el("select");[1,3,12].forEach(v=>{const o=el("option","",v+(v===1?" mes":" meses"));o.value=v;sel.append(o)});
  const pg=el("button","p","Marcó pagado");
  pg.onclick=()=>accion(pg,()=>api("POST","/api/clientes/"+c.slug+"/pago",{meses:Number(sel.value)}),j=>"Pagado hasta "+j.pagado_hasta);
  const py=el("div","acc");py.append(el("span","dom","Pagado hasta: "+(c.pagado_hasta||"—")),sel,pg);
  const a=el("div","acc"),p=el("button","",c.activo?"Pausar":"Activar"),r=el("button","","Copia de seguridad");
  p.onclick=()=>accion(p,()=>api("POST","/api/clientes/"+c.slug+"/pausa",{activo:!c.activo}),null);
  r.onclick=()=>accion(r,()=>api("POST","/api/clientes/"+c.slug+"/respaldo"),j=>"Copia: "+j.archivo);
  a.append(p,r);k.append(t,m,mo,ed,py,bloquePrueba(c),bloqueIA(c));
  if(c.pagos.length){const d=el("details"),h=el("ul","hist");d.append(el("summary","","Pagos ("+c.pagos.length+")"),h);
    c.pagos.forEach(x=>h.append(el("li","",x.fecha+" · US$ "+x.monto+" · "+x.meses+(x.meses===1?" mes":" meses"))));k.append(d)}
  k.append(a);return k;
}
function resumen(r){
  const b=$("resumen");b.replaceChildren(medida(r.activos,"clientes activos"),medida("US$ "+r.ingresos.toFixed(2),"ingresos mensuales esperados"),medida(r.vencidos,"vencidos"),medida(r.en_prueba,"en prueba"),medida(r.pruebas_por_vencer,"pruebas vencen en ≤3 días"));
}
function pintar(){
  if(!datos)return;
  resumen(datos.resumen);
  const l=$("lista");
  const pr=c=>c.prueba_dias!==null&&c.prueba_dias<=3;  // prueba vencida o por vencer: primero
  const v=datos.clientes.filter(c=>filtro==="todos"||(filtro==="pruebas"?c.prueba_dias!==null:c.estado_pago==="vencido"||c.estado_pago==="por_vencer"))
    .sort((a,b)=>filtro==="pruebas"?a.prueba_dias-b.prueba_dias||a.slug.localeCompare(b.slug)
      :(pr(b)-pr(a))||ORDEN[a.estado_pago]-ORDEN[b.estado_pago]||a.slug.localeCompare(b.slug));
  l.replaceChildren(...v.map(c=>tarjeta(c,datos.catalogo)));
  if(!v.length)l.append(el("p","dom","Sin clientes."))
}
async function accion(b,f,msg){
  b.disabled=true;
  try{const j=await f();aviso(msg?msg(j):"Hecho");await cargar()}catch(e){aviso(e.message)}finally{b.disabled=false}
}
async function cargar(){
  try{const j=await api("GET","/api/clientes");mostrar(true);
    datos=j;pintar()
  }catch(e){mostrar(false)}
}
$("login").onsubmit=async e=>{e.preventDefault();$("lerr").textContent="";
  try{await api("POST","/api/entrar",{clave:$("clave").value});$("clave").value="";cargar()}catch(x){$("lerr").textContent=x.message}};
$("salir").onclick=async()=>{await api("POST","/api/salir").catch(()=>{});mostrar(false)};
$("filtro").onchange=e=>{filtro=e.target.value;pintar()};
const slugDe=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
const CAMPOS=["nom","slug","dom","pin"];
let slugManual=false,creado=null,enviando=false;
function errCampo(id,t){const i=$(id),e=$("e_"+id);e.textContent=t||"";i.setAttribute("aria-invalid",t?"true":"false")}
function validar(){  // solo ayuda: el servidor manda
  const v={nom:$("nom").value.trim()?"":"Escribe el nombre del negocio.",
    slug:/^[a-z0-9-]{1,40}$/.test($("slug").value)?"":"Usa minúsculas, números y guiones (máx. 40).",
    dom:/^[a-z0-9.-]+\.[a-z]{2,}$/i.test($("dom").value.trim())?"":"Escribe un dominio válido, ej. pizza.tudominio.com.",
    pin:/^(\d{6})?$/.test($("pin").value)?"":"El PIN son 6 dígitos."};
  CAMPOS.forEach(k=>errCampo(k,v[k]));
  return CAMPOS.find(k=>v[k]);
}
function abrir(){
  $("fnuevo").reset();slugManual=false;creado=null;CAMPOS.forEach(k=>errCampo(k,""));$("nerr").textContent="";
  $("fnuevo").hidden=false;$("ok").hidden=true;$("crea").disabled=false;
  if(!$("dlg").open)$("dlg").showModal();$("nom").focus();
}
$("nuevo").onclick=abrir;$("otro").onclick=abrir;
$("cancela").onclick=$("cierra").onclick=()=>$("dlg").close();
$("nom").oninput=()=>{if(!slugManual)$("slug").value=slugDe($("nom").value)};
$("slug").oninput=()=>{slugManual=$("slug").value!==""};
$("gen").onclick=()=>{const b=new Uint32Array(1);crypto.getRandomValues(b);$("pin").value=String(b[0]%1000000).padStart(6,"0");errCampo("pin","")};
$("copia").onclick=async()=>{
  if(!creado)return;
  const t=["Hola, tu restaurante ya está listo.","Tu web de pedidos: "+creado.url_web,"Tu panel: "+creado.url_panel,"PIN del panel: "+creado.pin,
    ...(creado.prueba_hasta?["Prueba gratis hasta: "+creado.prueba_hasta]:[]),"Guarda el PIN y no lo compartas."].join(String.fromCharCode(10));
  try{await navigator.clipboard.writeText(t);aviso("Mensaje copiado")}catch(e){aviso("No se pudo copiar; selecciónalo a mano")}
};
$("fnuevo").onsubmit=async e=>{e.preventDefault();
  if(enviando)return;
  $("nerr").textContent="";
  const mal=validar();if(mal){$(mal).focus();return}
  enviando=true;$("crea").disabled=true;
  const d={nombre:$("nom").value.trim(),slug:$("slug").value,dominio:$("dom").value.trim(),color:$("col").value,prueba_dias:Number($("pru").value)};
  if($("pin").value)d.pin=$("pin").value;
  try{
    creado=await api("POST","/api/clientes",d);
    $("ok_web").textContent=$("ok_web").href=creado.url_web;
    $("ok_panel").textContent=$("ok_panel").href=creado.url_panel;
    $("ok_prueba").textContent=creado.prueba_hasta?"Prueba gratis hasta "+creado.prueba_hasta:"Sin prueba";
    $("ok_pin").textContent=creado.pin;
    $("fnuevo").hidden=true;$("ok").hidden=false;$("okt").focus();
    cargar();
  }catch(x){$("nerr").textContent=x.message}
  finally{enviando=false;$("crea").disabled=false}};
cargar();
</script>
</body>
</html>

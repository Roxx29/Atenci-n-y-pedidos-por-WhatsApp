# VPS unico, ~20 clientes. Guia: despliegue/vps.md  (uso: docker compose up -d --build)
x-duro: &duro   # endurecimiento comun de los contenedores del motor (sin root: USER 10001 en el Dockerfile)
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true          # solo escribe en /datos (volumen) y /tmp (memoria)
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "10"}

x-motor: &motor
  <<: *duro
  build: ../..
  restart: unless-stopped
  env_file: .env
  volumes:
    - datos:/datos
  depends_on:
    permisos: {condition: service_completed_successfully}

services:
  permisos:   # una vez por arranque: /datos de antes (creado como root) pasa al usuario 10001 del motor
    image: alpine:3.20
    command: ["chown", "-R", "10001:10001", "/datos"]
    volumes:
      - datos:/datos
    restart: "no"
  alojar:
    <<: *motor
    environment:   # <<: no fusiona en profundidad: se repite lo del ancla
      PROXY: "1"        # IP real del cliente detras de Caddy (ver nube.md)
      PROXY_SALTOS: "1"
      ALOJAR_HOST: "0.0.0.0"   # el puerto 8080 no se publica: solo Caddy (red interna) llega
      PANEL_PUBLICO: "1"       # el panel de cada cliente se sirve por su dominio (con PIN)
      SEGURIDAD_LOG: /datos/logs/seguridad.log   # registro de seguridad: rota a diario, 180 dias (SEGURIDAD_DIAS, minimo 90)
    command: ["python", "-m", "motor", "alojar", "/datos/clientes.yaml", "8080"]
  operador:
    <<: *duro
    build: ../..
    restart: unless-stopped
    volumes:
      - datos:/datos
    depends_on:
      permisos: {condition: service_completed_successfully}
    environment:   # solo lo suyo: sin el resto de secretos del .env
      OPERADOR_CLAVE: ${OPERADOR_CLAVE}
      WEB_SECRET: ${WEB_SECRET:-}
      PROXY: "1"
      OPERADOR_HOST: "0.0.0.0"   # el puerto 8081 no se publica: solo Caddy (red interna) llega
      SEGURIDAD_LOG: /datos/logs/seguridad-operador.log
      ALERTA_URL: ${ALERTA_URL:-}
    command: ["python", "-m", "motor", "operador", "/datos/clientes.yaml", "8081"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443"]
    environment:
      OPERADOR_DOMINIO: ${OPERADOR_DOMINIO}
      EMAIL_ACME: ${EMAIL_ACME}
      OPERADOR_IPS: ${OPERADOR_IPS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data   # certificados: no borrar (limite de Let's Encrypt)
    depends_on: [alojar, operador]
  respaldo:
    build: ./respaldo   # imagen con sqlite/rsync/age ya instalados (sin apk add en cada arranque)
    restart: unless-stopped
    environment:
      HORA_RESPALDO: ${HORA_RESPALDO:-03:30}
      DIAS_RESPALDO: ${DIAS_RESPALDO:-14}
      RESPALDO_DESTINO: ${RESPALDO_DESTINO:-}
      AGE_DESTINATARIO: ${AGE_DESTINATARIO:-}   # clave PUBLICA de age (age1...): las copias se cifran; la privada nunca en el VPS
      SSH_CLAVE: ${SSH_CLAVE:-}
    volumes:
      - datos:/datos
      - respaldos:/respaldos   # SOLO este contenedor lo monta: alojar/operador (lo expuesto a internet) no pueden tocar las copias
      - ./respaldo.sh:/respaldo.sh:ro
      - ${SSH_CLAVE:-/dev/null}:/clave:ro
    command: ["sh", "/respaldo.sh"]

volumes:
  datos:
  respaldos:
  caddy_datos:

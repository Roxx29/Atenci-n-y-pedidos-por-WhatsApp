<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de pedidos</title>
<style>body{font:16px system-ui;margin:12px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px;text-align:left}button{margin:2px;padding:6px}.pago_reportado{background:#fff3a0}.confirmado{background:#cfe4ff}#av{color:#a00}</style></head><body>
<div id="login"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button id="ok">Entrar</button> <span id="err"></span></div>
<div id="app" hidden><button id="salir">Salir</button><div id="av"></div><table><thead><tr><th>#</th><th>Estado</th><th>Cliente</th><th>Entrega</th><th>Total</th><th>Pedido</th><th></th></tr></thead><tbody id="t"></tbody></table></div>
<script>
const $=i=>document.getElementById(i);let ultimo=0,vistos=new Set(),timer;
async function api(u,b){const r=await fetch(u,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});const j=await r.json().catch(()=>({}));if(r.status===401&&u!=="/panel/entrar"){mostrar(false);throw 0}if(!r.ok)throw new Error(j.error||"Error");return j}
function mostrar(s){$("login").hidden=s;$("app").hidden=!s;clearInterval(timer);if(s){sondeo();timer=setInterval(sondeo,3000)}}
async function sondeo(){try{const e=await api("/panel/estado?desde="+ultimo);ultimo=e.ultimo;
$("av").textContent=e.avisos.map(a=>a.texto).join(" | ");const tb=$("t");tb.textContent="";
for(const p of e.pedidos){const tr=document.createElement("tr");tr.className=p.estado;
for(const v of [p.id,p.estado,p.nombre+" "+p.telefono,[p.zona,p.hora_deseada,p.notas].filter(Boolean).join(" · "),p.total,p.items.map(i=>i.cantidad+" x "+i.nombre).join(", ")]){const td=document.createElement("td");td.textContent=v??"";tr.append(td)}
const td=document.createElement("td");for(const a of p.acciones){const b=document.createElement("button");b.textContent=a;b.onclick=async()=>{try{await api("/panel/marcar",{pedido_id:p.id,estado:a==="cancelar"?"cancelado":a});sondeo()}catch(x){alert(x.message)}};td.append(b)}
if(p.comprobante){const l=document.createElement("a");l.href="/panel/comprobante/"+p.id;l.target="_blank";l.textContent="comprobante";td.append(l)}
tr.append(td);tb.append(tr)}
if(vistos.size&&e.pedidos.some(p=>!vistos.has(p.id)))try{new AudioContext().close();navigator.vibrate&&navigator.vibrate(200)}catch(x){}
vistos=new Set(e.pedidos.map(p=>p.id))}catch(x){}}
$("ok").onclick=async()=>{try{await api("/panel/entrar",{pin:$("pin").value});$("pin").value="";$("err").textContent="";mostrar(true)}catch(x){$("err").textContent=x.message}};
$("salir").onclick=async()=>{await api("/panel/salir",{}).catch(()=>{});mostrar(false)};
api("/panel/estado").then(()=>mostrar(true)).catch(()=>{});
</script></body></html>
